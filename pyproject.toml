[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imop"
version = "0.1.0"
description = "Monitor WebSocket bidireccional con visualizador JSON en tiempo real para dispositivos ESP32."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Esteban" }]
keywords = ["websocket", "esp32", "json", "monitor", "pyside6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "PySide6>=6.6",
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
imop = "imop.app:main"

[project.urls]
Homepage = "https://github.com/Esteban/i-mop-websocket"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print (prohibido print)
    "PTH", # flake8-use-pathlib
    "RUF", # ruff específicos
]

[tool.ruff.lint.isort]
known-first-party = ["imop"]

[tool.ruff.lint.per-file-ignores]
# Los scripts CLI sí usan print (salida por consola para el usuario).
"scripts/*" = ["T20"]
# Las pruebas pueden acceder a atributos privados deliberadamente.
"tests/*" = ["SLF001"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "imop.gui.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
    "gui: smoke tests de la GUI (requieren PySide6)",
]
